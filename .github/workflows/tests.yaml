name: Tests

on:
  pull_request: null
  push:
    branches:
      - develop-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pest:
    name: Pest
    runs-on: ubuntu-latest
    # The suite's phpunit.xml.dist pins CRAFT_DB_SERVER to the literal
    # hostname "db" (mirroring the local DDEV isolation recipe, where "db" is
    # DDEV's own database container hostname). GitHub Actions only resolves a
    # service container by its job key as a hostname when the job itself runs
    # inside a container — running this job in a container, with the mysql
    # service keyed "db", satisfies that pin without diverging the CI config
    # from the DDEV one.
    container:
      image: shivammathur/php:8.2
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_test
          MYSQL_USER: db
          MYSQL_PASSWORD: db
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
      - name: Register auth-kit VCS repository
        run: composer config repositories.craft-auth-kit vcs https://github.com/craftpulse/craft-auth-kit.git
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-ansi --no-progress
      - name: Run Pest
        run: vendor/bin/pest
